<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
<script src="data.js"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 15px;
    }

    .add-btn {
      background: #222;
      color: white;
      width: 100%;
    }

    .save-btn {
      background: #222;
      color: white;
      margin-right: 5px;
    }

    .edit-btn {
      background: #ddd;
      margin-right: 5px;
    }

    .delete-btn {
      background: #eee;
    }

    .logout-btn {
      background: #ddd;
    }

    #message {
      font-weight: bold;
    }

    .lecture {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .edit-form {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="box">
    <h1>🔐 Admin Dashboard</h1>

    <p>Courses / Lectures manage karo.</p>

    <button class="logout-btn" onclick="logoutAdmin()">
      Logout
    </button>
  </div>


  <div class="box">

<div class="card">

<div class="box">

  <h2>📘 Manage Subjects</h2>

  <input
    id="subject_name"
    placeholder="Subject Name"
  >

  <select id="subject_batch_id">
    <option value="">Select Batch</option>
  </select>

  <button
    class="add-btn"
    onclick="addSubject()">
    Add Subject
  </button>

  <p id="subject-message"></p>

  <div id="subjectList">
    Loading subjects...
  </div>

</div>
  
  <h2>📚 Manage Topics</h2>

  <input
    id="topic_name"
    placeholder="Topic Name"
  >

  <select id="topic_batch_id">
  <option value="">Select Batch</option>
</select>

<select id="topic_subject_id">
  <option value="">Select Subject</option>
</select>

  <button class="add-btn" onclick="addTopic()">
    Add Topic
  </button>

  <p id="topic-message"></p>
  
<div id="topicList">
  Loading topics...
</div>
  
</div>
    
    <h2>➕ Add Lecture</h2>

    <input id="name" placeholder="Lecture Name">

    <textarea id="description"
      placeholder="Lecture Description"></textarea>

    <input id="lecture_id"
      placeholder="Lecture ID (example: lecture-4)">

    <select id="batch_id">
  <option value="">Select Batch</option>
</select>

    <select id="subject_id">
  <option value="">Select Subject</option>
</select>

    <select id="topic_id">
  <option value="">Select Topic</option>
</select>

    <input id="video"
      placeholder="Google Drive Video ID">

    <button class="add-btn" onclick="addLecture()">
      Add Lecture
    </button>

    <p id="message"></p>

  </div>

<div class="box">

  <h2>🎯 Manage Batches</h2>

  <input
    id="batch_name"
    placeholder="Batch Name"
  >

  <input
    id="batch_target"
    placeholder="Target (example: CDS 1 2027 Target)"
  >

  <button
    class="add-btn"
    onclick="addBatch()">
    Add Batch
  </button>

  <p id="batch-message"></p>

  <div id="batchList">
    Loading batches...
  </div>

</div>
  
  <div class="box">

    <h2>📚 Existing Lectures</h2>

    <div id="lectureList">
      Loading...
    </div>

  </div>

</div>


<script>

  async function checkAdmin() {

    const { data } =
      await supabaseClient.auth.getUser();

    if (!data.user) {
      window.location.href = "admin.html";
    }

  }
async function loadSubjectBatches() {

  const batchSelect =
    document.getElementById("subject_batch_id");

  const { data, error } =
    await supabaseClient
      .from("batches")
      .select("id, name")
      .order("created_at", {
        ascending: true
      });

  if (error) {
    console.error("Subject batch load error:", error);
    return;
  }

  data.forEach(batch => {

    const option =
      document.createElement("option");

    option.value = batch.id;
    option.textContent = batch.name;

    batchSelect.appendChild(option);

  });

}
  
function loadTopics() {

  const batchSelect = document.getElementById("topic_batch_id");
  const subjectSelect = document.getElementById("topic_subject_id");

  batches.forEach(batch => {

    const option = document.createElement("option");

    option.value = batch.id;
    option.textContent = batch.name;

    batchSelect.appendChild(option);

  });

  batchSelect.addEventListener("change", function () {

    subjectSelect.innerHTML =
      '<option value="">Select Subject</option>';

    const selectedBatch = batches.find(
      batch => batch.id === batchSelect.value
    );

    if (!selectedBatch) return;

    selectedBatch.subjects.forEach(subject => {

      const option = document.createElement("option");

      option.value = subject.id;
      option.textContent = subject.name;

      subjectSelect.appendChild(option);

    });

  });

}  
async function loadLectureBatches() {

  const batchSelect =
    document.getElementById("batch_id");

  const { data, error } =
    await supabaseClient
      .from("batches")
      .select("id, name")
      .order("created_at", {
        ascending: true
      });

  if (error) {
    console.error(
      "Lecture batches load error:",
      error
    );
    return;
  }

  data.forEach(batch => {

    const option =
      document.createElement("option");

    option.value = batch.id;
    option.textContent = batch.name;

    batchSelect.appendChild(option);

  });

}
async function loadLectureSubjects() {

  const batchSelect =
    document.getElementById("batch_id");

  const subjectSelect =
    document.getElementById("subject_id");

  async function updateSubjects() {

    subjectSelect.innerHTML =
      '<option value="">Select Subject</option>';

    const batchId = batchSelect.value;

    if (!batchId) return;

    const { data, error } =
      await supabaseClient
        .from("subjects")
        .select("id, name")
        .eq("batch_id", batchId)
        .order("created_at", {
          ascending: true
        });

    if (error) {
      console.error(
        "Subjects load error:",
        error
      );
      return;
    }

    data.forEach(subject => {

      const option =
        document.createElement("option");

      option.value = subject.id;
      option.textContent = subject.name;

      subjectSelect.appendChild(option);

    });

  }

  batchSelect.addEventListener(
    "change",
    updateSubjects
  );

}
  async function loadLectureTopics() {

  const batchSelect =
    document.getElementById("batch_id");

  const subjectSelect =
    document.getElementById("subject_id");

  const topicSelect =
    document.getElementById("topic_id");

  async function updateTopics() {

    topicSelect.innerHTML =
      '<option value="">Select Topic</option>';

    const batchId = batchSelect.value;
    const subjectId = subjectSelect.value;

    if (!batchId || !subjectId) return;

    const { data, error } =
      await supabaseClient
        .from("topics")
        .select("id, name")
        .eq("batch_id", batchId)
        .eq("subject_id", subjectId)
        .order("created_at", {
          ascending: true
        });

    if (error) {
      console.error("Topics load error:", error);
      return;
    }

    data.forEach(topic => {

      const option =
        document.createElement("option");

      option.value = topic.id;
      option.textContent = topic.name;

      topicSelect.appendChild(option);

    });

  }

  batchSelect.addEventListener(
    "change",
    updateTopics
  );

  subjectSelect.addEventListener(
    "change",
    updateTopics
  );

}

  async function addSubject() {

  const name =
    document.getElementById("subject_name").value.trim();

  const batchId =
    document.getElementById("subject_batch_id").value.trim();

  const message =
    document.getElementById("subject-message");

  if (!name || !batchId) {
    message.textContent =
      "⚠️ Subject name aur batch select karo.";
    return;
  }

  const id = name
    .toLowerCase()
    .trim()
    .replace(/\s+/g, "-");

  const { error } =
    await supabaseClient
      .from("subjects")
      .insert([
        {
          id: id,
          name: name,
          batch_id: batchId
        }
      ]);

  if (error) {
    console.error(error);
    message.textContent =
      "❌ Subject add nahi ho paaya: " +
      error.message;
    return;
  }

  message.textContent =
    "✅ Subject successfully add ho gaya.";

  document.getElementById("subject_name").value = "";
  document.getElementById("subject_batch_id").value = "";

}

  async function loadSubjectList() {

  const list =
    document.getElementById("subjectList");

  const { data, error } =
    await supabaseClient
      .from("subjects")
      .select("id, name, batch_id")
      .order("created_at", {
        ascending: true
      });

  if (error) {
    console.error("Subject list error:", error);
    list.innerHTML =
      "❌ " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML =
      "No subjects found.";
    return;
  }

  list.innerHTML = "";

  data.forEach(subject => {

    const div =
      document.createElement("div");

    div.className = "lecture";

    div.innerHTML = `
      <strong>${escapeHtml(subject.name)}</strong>

      <br>
      Batch: ${escapeHtml(subject.batch_id)}

      <br>
      ID: ${escapeHtml(subject.id)}

      <br><br>

      <button
        class="edit-btn"
        onclick="showSubjectEditForm('${subject.id}')">
        ✏️ Edit
      </button>

      <button
        class="delete-btn"
        onclick="deleteSubject('${subject.id}')">
        🗑️ Delete
      </button>

      <div
        id="subject-edit-${subject.id}"
        class="edit-form hidden">

        <input
          id="subject-edit-name-${subject.id}"
          value="${escapeHtml(subject.name || '')}"
          placeholder="Subject Name">

        <button
          class="save-btn"
          onclick="updateSubject('${subject.id}')">
          💾 Save
        </button>

      </div>
    `;

    list.appendChild(div);

  });

  }
function showSubjectEditForm(id) {

  const form =
    document.getElementById("subject-edit-" + id);

  form.classList.toggle("hidden");

}


async function updateSubject(id) {

  const name =
    document
      .getElementById("subject-edit-name-" + id)
      .value
      .trim();

  if (!name) {
    alert("Subject name required hai.");
    return;
  }

  const { error } =
    await supabaseClient
      .from("subjects")
      .update({
        name: name
      })
      .eq("id", id);

  if (error) {
    console.error(error);
    alert(
      "❌ Subject update failed: " +
      error.message
    );
    return;
  }

  alert("✅ Subject updated successfully!");

  loadSubjectList();

}


async function deleteSubject(id) {

  const confirmDelete =
    confirm(
      "Kya tum is subject ko delete karna chahte ho?"
    );

  if (!confirmDelete) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("subjects")
      .delete()
      .eq("id", id);

  if (error) {
    console.error(error);
    alert(
      "❌ Subject delete failed: " +
      error.message
    );
    return;
  }

  alert("✅ Subject deleted successfully!");

  loadSubjectList();

}

  async function loadBatchList() {

  const list =

      .order("created_at", {

      });

  if (!name) {

  }

  const id = name
    .toLowerCase()
    .trim()
    .replace(/\s+/g, "-");

  const { error } =

      .from("batches")
      .insert([
        {
          id: id,
          name: name,
          target: target
        }
      ]);

  if (error) {

  async function addLecture() {

    const message =
      document.getElementById("message");

    const lecture = {

      name:
        document.getElementById("name").value.trim(),

      description:
        document.getElementById("description").value.trim(),

      lecture_id:
        document.getElementById("lecture_id").value.trim(),

      batch_id:
        document.getElementById("batch_id").value.trim(),

      subject_id:
        document.getElementById("subject_id").value.trim(),

      topic_id:
  document.getElementById("topic_id").value.trim(),

      video:
        document.getElementById("video").value.trim()

    };


    if (
  !lecture.name ||
  !lecture.lecture_id ||
  !lecture.batch_id ||
  !lecture.subject_id ||
  !lecture.topic_id ||
  !lecture.video
) {
  message.textContent = "⚠️ Required fields fill karo.";
  return;
}


    const { error } =
      await supabaseClient
        .from("courses")
        .insert([lecture]);


    if (error) {

      console.error(error);

      message.textContent =
        "❌ Error: " + error.message;

      return;

    }


    message.textContent =
      "✅ Lecture successfully added!";

    clearForm();

    loadLectures();

  }


  function clearForm() {

  document.getElementById("name").value = "";
  document.getElementById("description").value = "";
  document.getElementById("lecture_id").value = "";
  document.getElementById("batch_id").value = "";
  document.getElementById("subject_id").value = "";
  document.getElementById("topic_id").value = "";
  document.getElementById("video").value = "";

}


  async function loadLectures() {

    const { data, error } =
      await supabaseClient
        .from("courses")
        .select(
          "id, name, description, lecture_id, batch_id, subject_id, chapter_id, topic_id, video"
        )
        .order("created_at", {
          ascending: false
        });


    const list =
      document.getElementById("lectureList");


    if (error) {

      list.innerHTML =
        "❌ " + error.message;

      return;

    }


    if (!data || data.length === 0) {

      list.innerHTML =
        "No lectures found.";

      return;

    }


    list.innerHTML = "";


    data.forEach(lecture => {

      const div =
        document.createElement("div");

      div.className = "lecture";

      div.innerHTML = `

        <strong>${lecture.name}</strong>

        <br>
        Lecture: ${lecture.lecture_id}

        <br>
        Batch: ${lecture.batch_id}

        <br>
        Subject: ${lecture.subject_id}

        <br>
        Topic: ${lecture.topic_id}

        <br><br>

        <button
          class="edit-btn"
          onclick="showEditForm('${lecture.id}')">
          ✏️ Edit
        </button>

        <button
          class="delete-btn"
          onclick="deleteLecture('${lecture.id}')">
          🗑️ Delete
        </button>

        <div
          id="edit-${lecture.id}"
          class="edit-form hidden">

          <input
            id="edit-name-${lecture.id}"
            value="${escapeHtml(lecture.name || '')}"
            placeholder="Lecture Name">

          <textarea
            id="edit-description-${lecture.id}"
            placeholder="Description">${escapeHtml(lecture.description || '')}</textarea>

          <input
            id="edit-video-${lecture.id}"
            value="${escapeHtml(lecture.video || '')}"
            placeholder="Google Drive Video ID">

          <button
            class="save-btn"
            onclick="updateLecture('${lecture.id}')">
            💾 Save
          </button>

        </div>
      `;

      list.appendChild(div);

    });

  }


  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function showEditForm(id) {

    const form =
      document.getElementById("edit-" + id);

    form.classList.toggle("hidden");

  }


  async function updateLecture(id) {

    const name =
      document.getElementById("edit-name-" + id).value.trim();

    const description =
      document.getElementById("edit-description-" + id).value.trim();

    const video =
      document.getElementById("edit-video-" + id).value.trim();


    if (!name || !video) {

      alert("Lecture name aur video ID required hai.");

      return;

    }


    const { error } =
      await supabaseClient
        .from("courses")
        .update({
          name: name,
          description: description,
          video: video
        })
        .eq("id", id);


    if (error) {

      console.error(error);

      alert("❌ Update failed: " + error.message);

      return;

    }


    alert("✅ Lecture updated successfully!");

    loadLectures();

  }


  async function deleteLecture(id) {

    const confirmDelete =
      confirm("Kya tum is lecture ko delete karna chahte ho?");

    if (!confirmDelete) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("courses")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      alert("❌ Delete failed: " + error.message);

      return;

    }


    alert("✅ Lecture deleted successfully!");

    loadLectures();

  }


  async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    window.location.href = "admin.html";

  }

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
<script src="data.js"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 15px;
    }

    .add-btn {
      background: #222;
      color: white;
      width: 100%;
    }

    .save-btn {
      background: #222;
      color: white;
      margin-right: 5px;
    }

    .edit-btn {
      background: #ddd;
      margin-right: 5px;
    }

    .delete-btn {
      background: #eee;
    }

    .logout-btn {
      background: #ddd;
    }

    #message {
      font-weight: bold;
    }

    .lecture {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .edit-form {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="box">
    <h1>🔐 Admin Dashboard</h1>

    <p>Courses / Lectures manage karo.</p>

    <button class="logout-btn" onclick="logoutAdmin()">
      Logout
    </button>
  </div>


  <div class="box">

<div class="card">

  <h2>📚 Manage Topics</h2>

  <input
    id="topic_name"
    placeholder="Topic Name"
  >

  <input
    id="topic_batch_id"
    placeholder="Batch ID (example: batch-1)"
  >

  <input
    id="topic_subject_id"
    placeholder="Subject ID (example: gs)"
  >

  <button class="add-btn" onclick="addTopic()">
    Add Topic
  </button>

  <p id="topic-message"></p>

</div>
    
    <h2>➕ Add Lecture</h2>

    <input id="name" placeholder="Lecture Name">

    <textarea id="description"
      placeholder="Lecture Description"></textarea>

    <input id="lecture_id"
      placeholder="Lecture ID (example: lecture-4)">

    <input id="batch_id"
      placeholder="Batch ID (example: batch-1)">

    <input id="subject_id"
      placeholder="Subject ID (example: gs)">

    <select id="topic_id">
  <option value="">Select Topic</option>
</select>

    <input id="video"
      placeholder="Google Drive Video ID">

    <button class="add-btn" onclick="addLecture()">
      Add Lecture
    </button>

    <p id="message"></p>

  </div>


  <div class="box">

    <h2>📚 Existing Lectures</h2>

    <div id="lectureList">
      Loading...
    </div>

  </div>

</div>


<script>

  async function checkAdmin() {

    const { data } =
      await supabaseClient.auth.getUser();

    if (!data.user) {
      window.location.href = "admin.html";
    }

  }
function loadTopics() {

  const topicSelect = document.getElementById("topic_id");

  batches.forEach(batch => {

    batch.subjects.forEach(subject => {

      if (subject.chapters) {

        subject.chapters.forEach(topic => {

          const option = document.createElement("option");

          option.value = topic.id;
          option.textContent = topic.name;

          topicSelect.appendChild(option);

        });

      }

    });

  });

}

async function addTopic() {

  const name = document.getElementById("topic_name").value.trim();
  const batchId = document.getElementById("topic_batch_id").value.trim();
  const subjectId = document.getElementById("topic_subject_id").value.trim();
  const message = document.getElementById("topic-message");

  if (!name || !batchId || !subjectId) {
    message.textContent = "⚠️ Sabhi fields fill karo.";
    return;
  }

  const id = name
    .toLowerCase()
    .trim()
    .replace(/\s+/g, "-");

  const { error } = await supabaseClient
    .from("topics")
    .insert([
      {
        id: id,
        name: name,
        batch_id: batchId,
        subject_id: subjectId
      }
    ]);

  if (error) {

    console.error(error);

    message.textContent = "❌ Topic add nahi ho paaya.";
    return;

  }

  message.textContent = "✅ Topic successfully add ho gaya.";

  document.getElementById("topic_name").value = "";
  document.getElementById("topic_batch_id").value = "";
  document.getElementById("topic_subject_id").value = "";

}
  
  async function addLecture() {

    const message =
      document.getElementById("message");

    const lecture = {

      name:
        document.getElementById("name").value.trim(),

      description:
        document.getElementById("description").value.trim(),

      lecture_id:
        document.getElementById("lecture_id").value.trim(),

      batch_id:
        document.getElementById("batch_id").value.trim(),

      subject_id:
        document.getElementById("subject_id").value.trim(),

      topic_id:
  document.getElementById("topic_id").value.trim(),

      video:
        document.getElementById("video").value.trim()

    };


    if (
  !lecture.name ||
  !lecture.lecture_id ||
  !lecture.batch_id ||
  !lecture.subject_id ||
  !lecture.topic_id ||
  !lecture.video
) {
  message.textContent = "⚠️ Required fields fill karo.";
  return;
}


    const { error } =
      await supabaseClient
        .from("courses")
        .insert([lecture]);


    if (error) {

      console.error(error);

      message.textContent =
        "❌ Error: " + error.message;

      return;

    }


    message.textContent =
      "✅ Lecture successfully added!";

    clearForm();

    loadLectures();

  }


  function clearForm() {

  document.getElementById("name").value = "";
  document.getElementById("description").value = "";
  document.getElementById("lecture_id").value = "";
  document.getElementById("batch_id").value = "";
  document.getElementById("subject_id").value = "";
  document.getElementById("topic_id").value = "";
  document.getElementById("video").value = "";

}


  async function loadLectures() {

    const { data, error } =
      await supabaseClient
        .from("courses")
        .select(
          "id, name, description, lecture_id, batch_id, subject_id, chapter_id, topic_id, video"
        )
        .order("created_at", {
          ascending: false
        });


    const list =
      document.getElementById("lectureList");


    if (error) {

      list.innerHTML =
        "❌ " + error.message;

      return;

    }


    if (!data || data.length === 0) {

      list.innerHTML =
        "No lectures found.";

      return;

    }


    list.innerHTML = "";


    data.forEach(lecture => {

      const div =
        document.createElement("div");

      div.className = "lecture";

      div.innerHTML = `

        <strong>${lecture.name}</strong>

        <br>
        Lecture: ${lecture.lecture_id}

        <br>
        Batch: ${lecture.batch_id}

        <br>
        Subject: ${lecture.subject_id}

        <br>
        Topic: ${lecture.topic_id}

        <br><br>

        <button
          class="edit-btn"
          onclick="showEditForm('${lecture.id}')">
          ✏️ Edit
        </button>

        <button
          class="delete-btn"
          onclick="deleteLecture('${lecture.id}')">
          🗑️ Delete
        </button>

        <div
          id="edit-${lecture.id}"
          class="edit-form hidden">

          <input
            id="edit-name-${lecture.id}"
            value="${escapeHtml(lecture.name || '')}"
            placeholder="Lecture Name">

          <textarea
            id="edit-description-${lecture.id}"
            placeholder="Description">${escapeHtml(lecture.description || '')}</textarea>

          <input
            id="edit-video-${lecture.id}"
            value="${escapeHtml(lecture.video || '')}"
            placeholder="Google Drive Video ID">

          <button
            class="save-btn"
            onclick="updateLecture('${lecture.id}')">
            💾 Save
          </button>

        </div>
      `;

      list.appendChild(div);

    });

  }


  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function showEditForm(id) {

    const form =
      document.getElementById("edit-" + id);

    form.classList.toggle("hidden");

  }


  async function updateLecture(id) {

    const name =
      document.getElementById("edit-name-" + id).value.trim();

    const description =
      document.getElementById("edit-description-" + id).value.trim();

    const video =
      document.getElementById("edit-video-" + id).value.trim();


    if (!name || !video) {

      alert("Lecture name aur video ID required hai.");

      return;

    }


    const { error } =
      await supabaseClient
        .from("courses")
        .update({
          name: name,
          description: description,
          video: video
        })
        .eq("id", id);


    if (error) {

      console.error(error);

      alert("❌ Update failed: " + error.message);

      return;

    }


    alert("✅ Lecture updated successfully!");

    loadLectures();

  }


  async function deleteLecture(id) {

    const confirmDelete =
      confirm("Kya tum is lecture ko delete karna chahte ho?");

    if (!confirmDelete) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("courses")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      alert("❌ Delete failed: " + error.message);

      return;

    }


    alert("✅ Lecture deleted successfully!");

    loadLectures();

  }


  async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    window.location.href = "admin.html";

  }


  checkAdmin();
loadTopics();
loadLectures();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Subject</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 28px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 22px 16px 40px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #2563eb;
      font-weight: bold;
    }

    .page-title {
      font-size: 22px;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 19px;
      margin-bottom: 13px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .card h3 {
      font-size: 18px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <h1>Chal Waha Jate Hai</h1>
</header>

<div class="container">

  <a class="back" id="back-to-batch">← Back</a>

  <h2 class="page-title" id="subject-title">Subject</h2>

  <div id="chapter-list">
  <div class="card">
    <h3>Topics load ho rahe hain...</h3>
  </div>
  </div> 

</div>

<script src="supabase.js"></script>

<script>

const params =
  new URLSearchParams(window.location.search);

const subjectId =
  params.get("subject");

const batchId =
  params.get("batch") || "batch-1";

const subjectTitle =
  document.getElementById("subject-title");

const chapterList =
  document.getElementById("chapter-list");


async function loadSubjectTopics() {

  const { data: subjectData, error: subjectError } =
  await supabaseClient
    .from("subjects")
    .select("name")
    .eq("id", subjectId)
    .eq("batch_id", batchId)
    .maybeSingle();

if (subjectError || !subjectData) {
  subjectTitle.textContent = "Subject";
} else {
  subjectTitle.textContent = subjectData.name;
}

  chapterList.innerHTML = `
    <div class="card">
      <h3>Topics load ho rahe hain...</h3>
    </div>
  `;


  const { data, error } =
    await supabaseClient
      .from("topics")
      .select("id, name")
      .eq("batch_id", batchId)
      .eq("subject_id", subjectId)
      .order("created_at", {
        ascending: true
      });


  console.log("Subject ID:", subjectId);
  console.log("Batch ID:", batchId);
  console.log("Topics:", data);
  console.log("Error:", error);


  if (error) {

    chapterList.innerHTML = `
      <div class="card">
        <h3>❌ ${error.message}</h3>
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    chapterList.innerHTML = `
      <div class="card">
        <h3>❌ Koi topic nahi mila.</h3>
      </div>
    `;

    return;
  }


  chapterList.innerHTML = "";


  data.forEach(function(topic) {

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <h3>${topic.name}</h3>
    `;

    card.onclick = function() {
      window.location.href =
  "chapter.html?batch=" +
  encodeURIComponent(batchId) +
  "&subject=" +
  encodeURIComponent(subjectId) +
  "&chapter=" +
  encodeURIComponent(topic.id);

    };

    chapterList.appendChild(card);

  });

}


loadSubjectTopics();

</script>

</body>
</html>

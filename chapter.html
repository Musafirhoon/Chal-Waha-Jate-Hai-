<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chapter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 28px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 22px 16px 40px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .page-title {
      font-size: 22px;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 19px;
      margin-bottom: 13px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .card h3 {
      font-size: 18px;
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <h1>Chal Waha Jate Hai</h1>
</header>

<div class="container">

  <a class="back" href="javascript:history.back()">← Back</a>

  <h2 class="page-title" id="chapter-title">Chapter</h2>

  <div id="lecture-list"></div>

</div>

<script src="data.js"></script>
  <script src="supabase.js"></script>

<script>
const params = new URLSearchParams(window.location.search);

const subjectId = params.get("subject");
const topicId = params.get("chapter");

const chapterTitle = document.getElementById("chapter-title");
const lectureList = document.getElementById("lecture-list");

let selectedTopic = null;

async function loadTopicFromSupabase() {

  const { data, error } = await supabaseClient
    .from("topics")
    .select("id, name, batch_id, subject_id")
    .eq("id", topicId)
    .eq("subject_id", subjectId)
    .maybeSingle();

  if (error) {
    console.error("Topic load error:", error);
    return;
  }

  selectedTopic = data;

  if (selectedTopic) {
loadTopicFromSupabase();
  } 

console.log("Subject:", subjectId);
console.log("Topic:", topicId);
console.log("Supabase connected:", supabaseClient);


async function loadLecturesFromSupabase() {

  const { data, error } = await supabaseClient
    .from("courses")
    .select("id, name, description, lecture_id, batch_id, subject_id, chapter_id, topic_id, video")
    .eq("subject_id", subjectId)
    .eq("topic_id", topicId)
    .order("created_at", { ascending: true });

  if (error) {

    console.error("Supabase error:", error);

    lectureList.innerHTML = `
      <div class="card">
        <h3>❌ Lectures load nahi ho paayi.</h3>
      </div>
    `;

    return;
  }

  lectureList.innerHTML = "";

  if (!data || data.length === 0) {

    lectureList.innerHTML = `
      <div class="card">
        <h3>Lectures Coming Soon</h3>
      </div>
    `;

    return;
  }

  data.forEach(lecture => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <h3>▶️ ${lecture.name}</h3>
    `;

    card.onclick = function() {

      window.location.href =
        "lecture.html?subject=" + subjectId +
        "&chapter=" + topicId +
        "&lecture=" + lecture.lecture_id;

    };

    lectureList.appendChild(card);

  });

}


if (selectedTopic) {

  chapterTitle.textContent = selectedTopic.name;

  loadLecturesFromSupabase();

} else {

  chapterTitle.textContent = "Topic Not Found";

  lectureList.innerHTML = `
    <div class="card">
      <h3>❌ Topic nahi mila.</h3>
    </div>
  `;

}
</script>

</body>
</html>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Chal Waha Jate Hai</title>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }


    header {
      background: #111827;
      color: white;
      padding: 28px 18px;
      text-align: center;
    }


    header h1 {
      font-size: 26px;
      margin-bottom: 7px;
    }


    header p {
      color: #cbd5e1;
      font-size: 14px;
    }


    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 22px 16px 40px;
    }


    .page-title {
      font-size: 22px;
      margin-bottom: 18px;
    }


    .card {
      background: white;
      border-radius: 16px;
      padding: 19px;
      margin-bottom: 13px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
      cursor: pointer;
      border: 1px solid #e5e7eb;
    }


    .card:active {
      transform: scale(0.98);
    }


    .card h3 {
      font-size: 18px;
      margin-bottom: 7px;
    }


    .card p {
      color: #64748b;
      font-size: 14px;
      margin-top: 5px;
    }


    .batch-poster {
      width: 100%;
      height: 180px;
      background: #e5e7eb;
      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 15px;

      color: #64748b;
      font-size: 15px;
      text-align: center;
    }


    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #2563eb;
      font-weight: bold;
      cursor: pointer;
    }


    .hidden {
      display: none;
    }


    .loading {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }


    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }


    @media (max-width: 480px) {

      header h1 {
        font-size: 23px;
      }

      .container {
        padding: 18px 13px 30px;
      }

      .batch-poster {
        height: 150px;
      }

    }

  </style>

</head>


<body>


  <header>

    <h1>Chal Waha Jate Hai</h1>

    <p>Online Learning Platform</p>

  </header>



  <div class="container">


    <!-- HOME -->

    <section id="home">

      <h2 class="page-title">
        📚 Available Batches
      </h2>


      <!-- KILO BATCH -->

      <div class="card"
           onclick="showSubjects()">

        <div class="batch-poster">
          Poster yahan lagega
        </div>


        <h3>
          🎯 KILO BATCH
        </h3>


        <p>
          CDS 1 2027 Target
        </p>


        <p>
          🎓 CDS Aspirants ke liye
        </p>


        <p>
          📚 Mathematics • General Studies • English
        </p>


        <p>
          🎥 Lectures • 📝 Notes • 🧪 Tests
        </p>

      </div>



      <!-- BATCH 2 -->

      <div class="card">

        <h3>
          🎓 Batch 2
        </h3>

        <p>
          Coming Soon
        </p>

      </div>


    </section>



    <!-- SUBJECTS -->

    <section id="subjects"
             class="hidden">


      <div class="back"
           onclick="goHome()">

        ← Back

      </div>


      <h2 class="page-title">
        📚 KILO BATCH
      </h2>


      <div id="subject-list">

        <div class="loading">
          Subjects load ho rahe hain...
        </div>

      </div>


    </section>


  </div>



  <script>


    /*
      HOME
    */

    function goHome() {

      document
        .getElementById("subjects")
        .classList.add("hidden");


      document
        .getElementById("home")
        .classList.remove("hidden");


      history.replaceState(
        null,
        "",
        window.location.pathname
      );

    }



    /*
      LOAD SUBJECTS FROM SUPABASE
    */

    async function loadSubjects() {

      const subjectList =
        document.getElementById("subject-list");


      subjectList.innerHTML = `
        <div class="loading">
          ⏳ Subjects load ho rahe hain...
        </div>
      `;


      try {


        const {
          data,
          error
        } = await supabaseClient

          .from("courses")

          .select(
            "subject_id, name, batch_id"
          )

          .eq(
            "batch_id",
            "batch-1"
          );


        console.log(
          "Supabase subjects:",
          data
        );


        if (error) {

          console.error(
            "Supabase error:",
            error
          );


          subjectList.innerHTML = `
            <div class="error">
              ❌ Subjects load nahi ho paaye.
              <br><br>
              ${error.message}
            </div>
          `;

          return;

        }


        if (
          !data ||
          data.length === 0
        ) {

          subjectList.innerHTML = `
            <div class="error">
              ❌ KILO BATCH mein abhi koi subject nahi mila.
            </div>
          `;

          return;

        }



        /*
          Duplicate subjects remove
        */

        const uniqueSubjects = [];

        const seen = new Set();


        data.forEach(function(row) {

          if (
            row.subject_id &&
            !seen.has(row.subject_id)
          ) {

            seen.add(
              row.subject_id
            );

            uniqueSubjects.push(row);

          }

        });



        /*
          Clear loading
        */

        subjectList.innerHTML = "";



        /*
          Create subject cards
        */

        uniqueSubjects.forEach(
          function(subject) {


            const card =
              document.createElement("div");


            card.className =
              "card";


            card.innerHTML = `

              <h3>
                ${subject.name}
              </h3>

              <p>
                Subject ID: ${subject.subject_id}
              </p>

            `;



            card.onclick =
              function() {

                window.location.href =
                  "subject.html?subject=" +
                  encodeURIComponent(
                    subject.subject_id
                  );

              };



            subjectList.appendChild(
              card
            );

          }
        );


      }

      catch (error) {

        console.error(
          "Unexpected error:",
          error
        );


        subjectList.innerHTML = `
          <div class="error">
            ❌ Kuch problem aa gayi.
            <br><br>
            ${error.message}
          </div>
        `;

      }

    }



    /*
      SHOW SUBJECTS
    */

    function showSubjects() {


      document
        .getElementById("home")
        .classList.add("hidden");


      document
        .getElementById("subjects")
        .classList.remove("hidden");


      history.replaceState(
        null,
        "",
        "#subjects"
      );


      loadSubjects();

    }



    /*
      IF URL HAS #subjects
    */

    document.addEventListener(
      "DOMContentLoaded",
      function() {


        if (
          window.location.hash ===
          "#subjects"
        ) {

          showSubjects();

        }

      }
    );


  </script>


</body>

</html>
